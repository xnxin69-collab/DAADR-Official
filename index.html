版本化（v0.1 → v2.0），允许分叉、允许失败、允许迭代。我们记录每一次治理实验的日志，公开所有数据。",experiment_list_1:"· 试验区一：AI辅助陪审团与争议解决",experiment_list_2:"· 试验区二：链上UBI分配与反女巫攻击",experiment_list_3:"· 试验区三：二次方资助公共物品",experiment_image_caption:"文件: ./DAADR开放实验与加入.png / experiment.png / 创世.jpg",join_title:"加入我们",join_sub:"寻找第一批文明重写者",join_roles_title:"开放角色",join_role_1:"协议工程师",join_role_1_d:"Solidity / ZK / 分布式系统",join_role_2:"AI 对齐研究员",join_role_2_d:"治理模型、审议AI、偏见审计",join_role_3:"制度设计师",join_role_3_d:"政治经济学、宪法工程",join_role_4:"社区组织者",join_role_4_d:"多语言、教育、公共传播",join_role_5:"艺术家 / 叙事者",join_role_5_d:"用故事与视觉定义新文明美学",join_role_6:"公民审计员",join_role_6_d:"无需技术背景，监督与投票即是贡献",join_benefits_title:"你将获得",join_benefit_1:"创世公民身份与链上声誉溯源",join_benefit_2:"参与宪法级规则的制定权",join_benefit_3:"开放金库的二次方资助",join_benefit_4:"UBI 试验区早期分配资格",join_contact:"联系方式",join_email_btn:"发送邮件加入",donation_title:"捐助与金库",donation_sub:"所有资金流向链上公开",donation_wallet_label:"以太坊捐助地址 (ERC-20 / EVM)",donation_copy:"复制地址",donation_copied:"已复制",donation_qr_label:"QR 占位符 · 链上验证",donation_allocation_title:"资金分配",donation_a1:"协议研发",donation_a2:"UBI试验池",donation_a3:"社区与教育",donation_a4:"安全审计与储备",whitepaper_title:"白皮书与宪章",whitepaper_sub:"阅读原始文档，验证我们的承诺",whitepaper_pdf:"DAADR 独立宣言与创世书 (PDF)",whitepaper_docx:"完整中英文对照版 (DOCX)",whitepaper_vision:"我有一个愿景 (DOCX)",whitepaper_note:"路径: ./DAADR-独立宣言与创世书.pdf · ./DAADR-独立宣言与创世书完整中英文对照版.docx · ./我有一个愿景.docx",footer_genesis:"GENESIS YEAR ONE 2025",footer_tagline:"DAADR 2.0 · 去中心化AI自治自由民主共和国（试验区）",footer_rights:"无版权，开放分叉。Anti-copyright, Forkable."},en:{nav_home:"HOME",nav_mission:"MISSION",nav_vision:"VISION",nav_values:"VALUES",nav_governance:"GOV",nav_experiment:"EXPERIMENT",nav_join:"JOIN",nav_donation:"DONATE",nav_whitepaper:"PAPERS",hero_title:"Decentralized AI Autonomous Democratic Republic (Pilot Zone)",slogan:"Use decentralization to protect freedom, let AI serve humanity, and ensure benefits reach everyone",about:"Attempt to rebuild a world without dictatorship, corruption, privilege and fear through decentralized AI-assisted self-governance, end the era of working to survive via UBI, and begin era of innovating for dreams",hero_cta_whitepaper:"Manifesto PDF",hero_cta_charter:"Full Bilingual DOCX",hero_cta_vision:"Vision Doc",hero_genesis:"GENESIS YEAR ONE · 2025 · DAADR 2.0",mission_title:"Mission",mission_quote:"We choose, in spirit, to break with the decaying rules of the old world. We no longer seek to repair a machine already covered in rust. We choose instead to rewrite the operating system of human civilization.",mission_statement:"Through decentralized AI-assisted self-governance, rebuild a world without dictatorship, corruption, privilege, or fear",mission_desc:"DAADR is not a patch on the old system. It is a rebuild at the OS level. We believe corruption and autocracy are not bugs but features of centralized power. Only by returning decision, execution and oversight to an open, AI-assisted distributed citizen network can we uproot privilege.",mission_image_caption:"File: ./DAADR使命与愿景.png / mission.png",vision_title:"Vision",vision_p1:"We envision a world where labor is no longer a shackle for survival. Automation and AI undertake most repetitive production, and material abundance becomes the default.",vision_p2:"In DAADR, identity, birth, hukou, and connections no longer determine resource access. Universal Basic Income (UBI) is distributed automatically via on-chain protocol, ensuring everyone can stand with dignity.",vision_p3:"Governance is transparent and verifiable. Every rule, every vote, every treasury expenditure is recorded on an immutable public ledger, audited by citizens and AI auditors together.",vision_p4:"Innovation is no longer suppressed by bureaucracy. Anyone can submit a proposal, through AI-assisted deliberation and community voting, quickly gain resources and collaboration to enter the open experiment.",vision_p5:"Finally, we aim to build a civilization without fear — people no longer fear unemployment, censorship, or punishment for speech. Because power has been radically decentralized, freedom has a cryptographic anchor.",vision_quote:"End the history of working merely to survive, begin era of innovating for dreams",values_title:"Eight Foundations",values_sub:"DAADR Civilizational Protocol · 8 Foundations",values_desc:"Not slogans, but executable constraints written into the genesis block of governance contracts.",governance_title:"Governance Flow",governance_sub:"From proposal to execution, autonomous and transparent",governance_s1_title:"Proposal",governance_s1_desc:"Any citizen can submit on-chain proposal, staking minimal reputation to prevent spam",governance_s2_title:"AI Review",governance_s2_desc:"Decentralized AI cluster performs constitutional, risk, feasibility review, generates public audit report",governance_s3_title:"Vote",governance_s3_desc:"Quadratic voting + reputation weight, 48h cool-off to prevent emotional tyranny of majority",governance_s4_title:"Execution",governance_s4_desc:"Passed proposals auto-executed by multi-sig timelock, funds, permissions and rules updated synchronously",experiment_title:"Open Experiment",experiment_sub:"We are not building a nation, we are running a social experiment",experiment_desc:"The DAADR pilot currently operates in digital space and distributed communities. All institutions are versioned (v0.1 → v2.0), forkable, allowed to fail and iterate. We log every governance experiment publicly.",experiment_list_1:"· Pilot 1: AI-assisted jury and dispute resolution",experiment_list_2:"· Pilot 2: On-chain UBI distribution & anti-Sybil",experiment_list_3:"· Pilot 3: Quadratic funding for public goods",experiment_image_caption:"File: ./DAADR开放实验与加入.png / experiment.png / 创世.jpg",join_title:"Join Us",join_sub:"Seeking the first cohort of civilization rewriters",join_roles_title:"Open Roles",join_role_1:"Protocol Engineer",join_role_1_d:"Solidity / ZK / Distributed Systems",join_role_2:"AI Alignment Researcher",join_role_2_d:"Governance models, deliberation AI, bias audit",join_
